# Static: no settings are substituted here.
apiVersion: v1
kind: Service
metadata:
  name: jar-chat
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: jarchat
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jar-chat
  ports:
    - name: jarchat
      port: 80
      targetPort: http
---
# Cluster-internal MCP endpoint, deliberately without Tailscale exposure.
# Agents use http://jar-mcp.<NAMESPACE>.svc.cluster.local/mcp
apiVersion: v1
kind: Service
metadata:
  name: jar-mcp
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: jarmcp
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: jar-mcp
  ports:
    - name: mcp
      port: 80
      targetPort: mcp
