# Template: placeholders receive JSON-quoted YAML scalars from ENV_FILE.
# Add only allowlisted runtime settings here; credentials belong in secret.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jar-runtime
  namespace: ${NAMESPACE}
data:
  DB_URL: ${DB_URL}
  DB_DISABLE_SSL: ${DB_DISABLE_SSL}
  CHAT_URL: ${CHAT_URL}
  EMBEDDING_URL: ${EMBEDDING_URL}
  CHAT_API_MODEL: ${CHAT_API_MODEL}
  EMBEDDING_API_MODEL: ${EMBEDDING_API_MODEL}
  DOCS: ${DOCS}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL}
  DIMENSIONS: ${DIMENSIONS}
  FORCE_INDEX: ${FORCE_INDEX}
  DOCUMENT_WORKERS: ${DOCUMENT_WORKERS}
  EMBEDDING_WORKERS: ${EMBEDDING_WORKERS}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE}
  EMBEDDING_BUFFER_BATCHES: ${EMBEDDING_BUFFER_BATCHES}
  INSERT_BATCH_SIZE: ${INSERT_BATCH_SIZE}
  CHAT_PORT: ${CHAT_PORT}
  CHAT_ALLOW_ANY_HOST: ${CHAT_ALLOW_ANY_HOST}
  CHAT_PUBLIC_URL: ${CHAT_PUBLIC_URL}
  MCP_PORT: ${MCP_PORT}
