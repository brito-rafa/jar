# Two models on two separate GPUs in the same cluster and namespace (jar in SETUP.md).
# Ministral -> NVIDIA RTX 5060 Ti; embeddings -> AMD RX 6600.
# Resource memory values are host RAM limits, not VRAM limits.
# One replica per service avoids requesting a second exclusive GPU allocation.
---
# Chat. Mistral recommends temperature below 0.1 for everyday use; requests can override it.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: ministral-3-8b
  annotations:
    serving.kserve.io/deploymentMode: Standard
spec:
  predictor:
    # The Tailscale operator (hack/k8s-setup/04-tailscale.sh) exposes the predictor Service on
    # the tailnet as http://ministral. KServe copies these annotations only when it creates that
    # Service; 02-kserve.sh carries them to an existing one. llama.cpp has no authentication,
    # so every tailnet device your ACL allows can use the model. Remove both to stay cluster-only.
    annotations:
      tailscale.com/expose: "true"
      tailscale.com/hostname: ministral
    # This model needs the node's only GPU of its kind, so a rolling update would wait forever for a
    # second one. Recreate stops the old pod first; the model is unavailable while the new one loads.
    deploymentStrategy:
      type: Recreate
    minReplicas: 1
    maxReplicas: 1
    model:
      modelFormat:
        name: gguf
      runtime: llamacpp-cuda
      storageUri: hf-gguf://mistralai/Ministral-3-8B-Instruct-2512-GGUF/Ministral-3-8B-Instruct-2512-Q4_K_M.gguf
      args: ["-m", "/mnt/models/Ministral-3-8B-Instruct-2512-Q4_K_M.gguf",
             "--alias", "ministral-3-8b", "-c", "16384", "-np", "1", "--jinja", "--temp", "0.05"]
      resources:
        requests: {cpu: "2", memory: 4Gi}
        limits: {memory: 8Gi, nvidia.com/gpu: 1}
