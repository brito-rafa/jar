# Cluster-scoped resources: one single-file GGUF downloader and two runtimes.
# Apply before the example-isvc-*.yaml InferenceServices (hack/k8s-setup/02-kserve.sh does both).
# Select runtimes explicitly; CUDA uses NVIDIA, ROCm uses AMD.
# Images retain upstream moving tags from the original; pin tested digests for reproducibility.
---
# Downloads ONE file from a Hugging Face repo. URI format:
#   hf-gguf://<org>/<repo>/<path/to/file.gguf>
# (KServe's built-in hf:// handler snapshots the whole repo, i.e. every quant.)
# KServe runs this as the pod's init container and appends two arguments: the storageUri and
# the destination directory (/mnt/models). The container name must be "storage-initializer".
apiVersion: serving.kserve.io/v1alpha1
kind: ClusterStorageContainer
metadata:
  name: hf-gguf
spec:
  container:
    name: storage-initializer
    image: curlimages/curl:latest
    command:
    - /bin/sh
    - -c
    - |
      set -eu
      src="${1#hf-gguf://}"                     # org/repo/path/to/file.gguf
      dest="$2"
      repo="$(echo "$src" | cut -d/ -f1-2)"
      file="${src#*/*/}"
      url="https://huggingface.co/${repo}/resolve/${HF_REVISION:-main}/${file}"
      out="${dest}/$(basename "$file")"
      mkdir -p "$dest"
      echo "hf-gguf: ${url} -> ${out}"
      set -- -fL --retry 5 --retry-all-errors -C - -o "${out}.part"
      if [ -n "${HF_TOKEN:-}" ]; then
        set -- "$@" -H "Authorization: Bearer ${HF_TOKEN}"
      fi
      curl "$@" "$url"
      mv "${out}.part" "$out"
      ls -lh "$out"
    - hf-gguf                                    # $0 for the script; KServe's args become $1 and $2
    env:
    - name: HF_TOKEN                             # only needed for gated repos; secret is optional
      valueFrom:
        secretKeyRef:
          name: hf-secret                        # must live in the InferenceService's namespace
          key: HF_TOKEN
          optional: true
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: "1"
        memory: 256Mi
  supportedUriFormats:
  - prefix: hf-gguf://
---
apiVersion: serving.kserve.io/v1alpha1
kind: ClusterServingRuntime
metadata:
  name: llamacpp-rocm
spec:
  supportedModelFormats:
  - name: gguf
    autoSelect: false
  containers:
  - name: kserve-container
    image: ghcr.io/ggml-org/llama.cpp:server-rocm   # fallback if ROCm balks: ghcr.io/ggml-org/llama.cpp:server-vulkan
    args: ["--host", "0.0.0.0", "--port", "8080", "-ngl", "99"]
    env:
    - name: HSA_OVERRIDE_GFX_VERSION   # RX 6600 (gfx1032) isn't on ROCm's support list; present it as gfx1030
      value: "10.3.0"
    # Retain the original RX 6600 compatibility configuration.
    # The InferenceService now reserves amd.com/gpu for scheduler accounting.
    securityContext:
      privileged: true
    volumeMounts:
    - {name: kfd, mountPath: /dev/kfd}
    - {name: dri, mountPath: /dev/dri}
    ports:
    - containerPort: 8080
      protocol: TCP
    readinessProbe:                     # llama-server answers 503 on /health until the model is loaded
      httpGet: {path: /health, port: 8080}
      periodSeconds: 10
      failureThreshold: 60
  volumes:
  - {name: kfd, hostPath: {path: /dev/kfd}}
  - {name: dri, hostPath: {path: /dev/dri}}
---
apiVersion: serving.kserve.io/v1alpha1
kind: ClusterServingRuntime
metadata:
  name: llamacpp-cuda
spec:
  supportedModelFormats:
  - name: gguf
    autoSelect: false
  containers:
  - name: kserve-container
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    args: ["--host", "0.0.0.0", "--port", "8080", "-ngl", "99"]
    ports:
    - containerPort: 8080
      protocol: TCP
    readinessProbe:
      httpGet: {path: /health, port: 8080}
      periodSeconds: 10
      failureThreshold: 60