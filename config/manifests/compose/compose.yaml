services:
  duckdb:
    image: duckdb/duckdb:2.0.0
    command: ["/duckdb", "/data/jar.db", "-bail", "-init", "/app/duckdb.sql", "-serve"]
    environment:
      JAR_DB_TOKEN: ${JAR_DB_TOKEN:?Run make local-db-init first}
    ports:
      - "127.0.0.1:${DB_PORT:-9494}:9494"
    volumes:
      - type: bind
        source: ${DB_DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
      - ./hack/duck/duckdb.sql:/app/duckdb.sql:ro
    healthcheck:
      test: ["CMD", "/duckdb", "-c", "LOAD quack; FROM quack_query('quack:127.0.0.1:9494', 'SELECT 1', token = getenv('JAR_DB_TOKEN'));"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    stdin_open: true
    restart: unless-stopped
    stop_grace_period: 30s
